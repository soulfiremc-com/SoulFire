[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "soulfire"
version = "2.10.1"
description = "Python SDK for automating SoulFire bots over gRPC-Web."
readme = "README.md"
requires-python = ">=3.14"
license = "AGPL-3.0-only"
authors = [
  { name = "SoulFire" },
]
dependencies = [
  "connectrpc>=0.12.1,<0.13",
  "googleapis-common-protos>=1.70,<2",
  "protobuf>=6.31.1,<8",
]

[project.urls]
Homepage = "https://soulfiremc.com"
Repository = "https://github.com/soulfiremc-com/SoulFire"

[project.optional-dependencies]
dev = [
  "hatchling>=1.27",
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.2,<2",
  "pyright>=1.1.411,<1.2",
  "ruff>=0.16,<0.17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/soulfire"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
include = ["src/soulfire"]
exclude = [
  "src/soulfire/*_connect.py",
  "src/soulfire/*_pb2.py",
  "src/soulfire/**/*_connect.py",
  "src/soulfire/**/*_pb2.py",
]
ignore = [
  "src/soulfire/*_connect.py",
  "src/soulfire/*_pb2.py",
  "src/soulfire/*_pb2.pyi",
  "src/soulfire/**/*_connect.py",
  "src/soulfire/**/*_pb2.py",
  "src/soulfire/**/*_pb2.pyi",
]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.ruff]
extend-exclude = [
  "src/soulfire/*_connect.py",
  "src/soulfire/*_pb2.py",
  "src/soulfire/*_pb2.pyi",
]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
