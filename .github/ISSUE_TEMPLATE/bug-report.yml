name: Bug report
description: Report a reproducible problem with the server, CLI, SDKs, or build.
labels: ["type: :bug: bug"]
body:
  - type: markdown
    attributes:
      value: |
        For setup questions, use [support resources](https://github.com/soulfiremc-com/SoulFire/blob/main/SUPPORT.md).
        For desktop GUI bugs, use [SoulFireClient issues](https://github.com/soulfiremc-com/SoulFireClient/issues).
        Report vulnerabilities privately through the [security policy](https://github.com/soulfiremc-com/SoulFire/blob/main/SECURITY.md).
        Remove tokens, passwords, account data, and proxy credentials from your report and attachments.
  - type: checkboxes
    id: existing-issues
    attributes:
      label: Existing reports
      options:
        - label: I searched open and closed issues for the same problem.
          required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Server or bot behavior
        - CLI
        - TypeScript SDK
        - Python SDK
        - Build or installation
        - Plugin API
        - Rendering or native runtime
        - Other or unknown
    validations:
      required: true
  - type: input
    id: soulfire-version
    attributes:
      label: Soulfire version
      description: Copy the exact startup version. For a source build, include the revision or its GitHub link.
      placeholder: Release version, nightly build identifier, or source revision
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the details that apply. Write "unknown" if you cannot determine a value.
      placeholder: |
        OS and CPU architecture:
        Java version (java -version):
        Launch method (dedicated JAR, CLI, Docker, or source):
        Target Minecraft version and server software:
        SDK package and runtime versions, if relevant:
        Plugins, proxies, or configuration relevant to the problem:
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: What happened?
      description: Describe the problem, including any error and how often it occurs.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: What did you expect?
      description: Describe the result you expected from the same steps.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include minimal configuration or code. If reproduction is intermittent, describe the conditions you observed.
      placeholder: |
        1. Start Soulfire with ...
        2. Connect a bot to ...
        3. Run ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and supporting evidence
      description: Paste relevant text logs or attach a redacted log file. Include the full exception and its causes, if available.
      placeholder: Relevant logs, screenshots, or a link to a redacted log
  - type: textarea
    id: regression
    attributes:
      label: Regression and workarounds
      description: If a previous version worked, name it. Include any workaround or comparison with a vanilla client.
