name: Deploy Javadoc

on: [ workflow_dispatch, workflow_call ]

jobs:
  build:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '27'
          distribution: 'temurin'
          check-latest: true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build with Gradle
        run: ./gradlew :javadoc:javadoc --stacktrace
      - name: Deploy Javadoc
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./javadoc/build/docs/javadoc
          cname: jd.soulfiremc.com
          force_orphan: true
          commit_message: 'docs(javadoc): deploy generated documentation'
