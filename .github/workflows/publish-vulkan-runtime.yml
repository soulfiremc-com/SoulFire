name: Publish Vulkan runtime

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-vulkan-runtime
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release version and publishing credentials
        env:
          CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY }}
        run: |
          version="$(sed -n 's/^vulkan_runtime_version=//p' gradle.properties)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Set vulkan_runtime_version to a release version such as 1.0.0.'
            exit 1
          fi
          for credential in CENTRAL_USERNAME CENTRAL_PASSWORD SIGNING_KEY; do
            if [[ -z "${!credential}" ]]; then
              echo "::error::Missing publishing credential: $credential. See vulkan-runtime/README.md."
              exit 1
            fi
          done
          echo "Publishing com.soulfiremc:vulkan-runtime:$version" >> "$GITHUB_STEP_SUMMARY"

  native-runtime:
    needs: validate
    uses: ./.github/workflows/vulkan-runtime.yml

  publish:
    needs: native-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '27'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Download native Vulkan runtimes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: vulkan-*
          merge-multiple: true
          path: build/vulkan-prebuilt
      - name: Verify publishing build logic
        run: ./gradlew :buildSrc:test --stacktrace
      - name: Publish native runtime to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_CENTRAL_SIGNING_PASSWORD }}
        run: >-
          ./gradlew :vulkan-runtime:publishAndReleaseToMavenCentral
          -PvulkanPlatforms=all -PvulkanRuntimeDirectory=build/vulkan-prebuilt --stacktrace
