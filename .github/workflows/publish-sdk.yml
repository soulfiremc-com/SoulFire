name: Publish SDKs
run-name: Publish SDKs v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version declared by all SDK package manifests
        required: true
        type: string
      publish_npm:
        description: Publish @soulfiremc/sdk and @soulfiremc/beat-game to npm
        required: true
        default: true
        type: boolean
      publish_pypi:
        description: Publish soulfire to PyPI
        required: true
        default: true
        type: boolean
      publish_jsr:
        description: Publish @soulfiremc/sdk to JSR
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-sdks
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify packages
    if: inputs.publish_npm || inputs.publish_pypi || inputs.publish_jsr
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node -e 'const version = require("./sdk/typescript/package.json").version; if (version !== process.env.RELEASE_VERSION) throw new Error(`TypeScript SDK version ${version} does not match ${process.env.RELEASE_VERSION}`)'
          node -e 'const version = require("./sdk/beat-game/package.json").version; if (version !== process.env.RELEASE_VERSION) throw new Error(`Beat-game SDK version ${version} does not match ${process.env.RELEASE_VERSION}`)'
          node -e 'const version = require("./sdk/typescript/jsr.json").version; if (version !== process.env.RELEASE_VERSION) throw new Error(`JSR SDK version ${version} does not match ${process.env.RELEASE_VERSION}`)'
          node -e 'const fs = require("node:fs"); const text = fs.readFileSync("sdk/typescript/src/connection.ts", "utf8"); const version = text.match(/SDK_VERSION = "([^"]+)"/)?.[1]; if (version !== process.env.RELEASE_VERSION) throw new Error(`TypeScript handshake version ${version} does not match ${process.env.RELEASE_VERSION}`)'
          python -c 'import os, pathlib, re; text = pathlib.Path("sdk/python/pyproject.toml").read_text(); match = re.search(r"(?m)^version = \"([^\"]+)\"$", text); version = match.group(1) if match else None; expected = os.environ["RELEASE_VERSION"]; assert version == expected, f"Python SDK version {version} does not match {expected}"'
          python -c 'import os, pathlib, re; text = pathlib.Path("sdk/python/src/soulfire/connection.py").read_text(); match = re.search(r"(?m)^SDK_VERSION: Final = \"([^\"]+)\"$", text); version = match.group(1) if match else None; expected = os.environ["RELEASE_VERSION"]; assert version == expected, f"Python handshake version {version} does not match {expected}"'
      - name: Install TypeScript dependencies
        run: bun install --frozen-lockfile
      - name: Generate SDK bindings
        run: bun run sdk:generate
      - name: Verify generated bindings
        run: git diff --exit-code -- sdk/typescript/src/generated sdk/python/src/soulfire
      - name: Lint Protobuf definitions
        run: bun run sdk:lint-proto
      - name: Validate Mineflayer parity audit
        run: node scripts/validate-mineflayer-parity.mjs
      - name: Check TypeScript SDK
        run: bun run --filter @soulfiremc/sdk check
      - name: Import Node.js entry points
        run: |
          node -e 'const sdk = await import("./sdk/typescript/dist/node.js"); if (typeof sdk.SoulFire.connect !== "function") throw new Error("Effect Node.js entry point is invalid")'
          node -e 'const sdk = await import("./sdk/typescript/dist/node-promise.js"); if (typeof sdk.SoulFire.connect !== "function") throw new Error("Promise Node.js entry point is invalid")'
      - name: Verify npm package contents
        working-directory: sdk/typescript
        run: |
          package_dir="$(mktemp -d)"
          bun pm pack --destination "$package_dir"
          package_archive="$(find "$package_dir" -name '*.tgz' -print -quit)"
          tar -tf "$package_archive" | grep -q 'package/dist/index.js'
          tar -tf "$package_archive" | grep -q 'package/dist/browser.js'
          tar -tf "$package_archive" | grep -q 'package/dist/bun.js'
          tar -tf "$package_archive" | grep -q 'package/dist/bun-promise.js'
          tar -tf "$package_archive" | grep -q 'package/dist/node.js'
          tar -tf "$package_archive" | grep -q 'package/dist/node-promise.js'
          tar -tf "$package_archive" | grep -q 'package/dist/platform.js'
          tar -tf "$package_archive" | grep -q 'package/dist/cli.js'
          tar -tf "$package_archive" | grep -q 'package/dist/plugin-generator.js'
      - name: Verify JSR package
        if: inputs.publish_jsr
        working-directory: sdk/typescript
        run: npx --yes jsr@0.14.3 publish --dry-run
      - name: Install Python SDK dependencies
        run: python -m pip install --disable-pip-version-check -e 'sdk/python[dev]'
      - name: Check Python SDK
        run: |
          python -m ruff check sdk/python
          python -m ruff format --check sdk/python
          python -m pyright -p sdk/python
          python -m pytest sdk/python
      - name: Build npm package
        if: inputs.publish_npm
        working-directory: sdk/typescript
        run: |
          mkdir -p ../../.artifacts/npm
          bun pm pack --destination ../../.artifacts/npm
      - name: Build beat-game npm package
        if: inputs.publish_npm
        working-directory: sdk/beat-game
        run: bun pm pack --destination ../../.artifacts/npm
      - name: Build Python package
        if: inputs.publish_pypi
        working-directory: sdk/python
        run: python -m hatchling build
      - name: Upload npm package
        if: inputs.publish_npm
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: npm-package
          path: .artifacts/npm/*.tgz
          if-no-files-found: error
          retention-days: 1
      - name: Upload Python package
        if: inputs.publish_pypi
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: python-package
          path: sdk/python/dist/*
          if-no-files-found: error
          retention-days: 1

  publish-npm:
    name: Publish to npm
    if: inputs.publish_npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install current npm
        run: npm install --global npm@latest
      - name: Download npm package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: npm-package
          path: dist/npm
      - name: Publish npm package
        run: |
          for package_archive in dist/npm/*.tgz; do
            npm publish "$package_archive" --access public
          done

  publish-pypi:
    name: Publish to PyPI
    if: inputs.publish_pypi
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download Python package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: python-package
          path: dist/python
      - name: Publish Python package
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/python

  publish-jsr:
    name: Publish to JSR
    if: inputs.publish_jsr
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install TypeScript dependencies
        run: bun install --frozen-lockfile
      - name: Publish JSR package
        working-directory: sdk/typescript
        run: npx --yes jsr@0.14.3 publish
