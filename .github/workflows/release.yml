name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
      after-version:
        description: 'Snapshot version after release'
        required: true

# FIXME: Entire secret keys should not be inherited, Use specific set of secrets explicitly instead.
# See this issue to learn more: https://github.com/zizmorcore/zizmor/issues/360
jobs:
  native-runtime:
    uses: ./.github/workflows/vulkan-runtime.yml
    permissions:
      contents: read

  set-release-version:
    uses: soulfiremc-com/SoulFire/.github/workflows/set-version.yml@main
    permissions:
      contents: write
    with:
      version: ${{ inputs.version }}
      update_sdk: true
    secrets: inherit

  build:
    needs: [set-release-version, native-runtime]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '27'
          distribution: 'temurin'
          check-latest: true
      - name: Download native Vulkan runtimes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: vulkan-*
          merge-multiple: true
          path: build/vulkan-prebuilt
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build with Gradle
        run: ./gradlew build test -PvulkanPlatforms=all -PvulkanRuntimeDirectory=build/vulkan-prebuilt --stacktrace --scan

      - name: Build Changelog
        id: github_release
        uses: mikepenz/release-changelog-builder-action@b0db9d18b53447ef9f940a46c8f31653c4d9f621 # v6.5.0
        with:
          mode: COMMIT
          toTag: ${{ github.ref }}
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}",
              "commit_template": "- [`#{{SHORT_MERGE_SHA}}`](https://github.com/soulfiremc-com/SoulFire/commit/#{{MERGE_SHA}}) #{{TITLE}}",
              "categories": [
                {
                    "title": "## 🚀 Features",
                    "labels": ["feat", "feature"]
                },
                {
                    "title": "## 🐛 Fixes",
                    "labels": ["fix", "bug"]
                },
                {
                    "title": "## 🏎️ Performance",
                    "labels": ["perf"]
                },
                {
                    "title": "## 🏗 Refactor",
                    "labels": ["refactor"]
                },
                {
                    "title": "## 📝 Documentation",
                    "labels": ["docs"]
                },
                {
                    "title": "## 🔨 Build",
                    "labels": ["build", "chore", "ci"]
                },
                {
                    "title": "## 💅 Style",
                    "labels": ["style"]
                },
                {
                    "title": "## 🧪 Tests",
                    "labels": ["test"]
                },
                {
                    "title": "## 💬 Other",
                    "labels": []
                },
                {
                  "title": "## 📦 Dependencies",
                  "labels": ["dependencies"]
                }
              ],
              "empty_template": "no changes",
              "label_extractor": [
                {
                  "pattern": "^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test){1}(\\([\\w\\-\\.]+\\))?(!)?: ([\\w ])+([\\s\\S]*)",
                  "on_property": "title",
                  "target": "$1"
                }
              ],
              "custom_placeholders": [
                {
                  "name": "SHORT_MERGE_SHA",
                  "source": "MERGE_SHA",
                  "transformer": {
                    "pattern": "^([0-9a-f]{7})[0-9a-f]*$",
                    "target": "$1"
                  }
                }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body: |
            ---
            > [!IMPORTANT]
            > These downloads are for users who want to host Dedicated Servers for SoulFire clients or use the CLI client of SoulFire.
            > This is not the right download if you want to use the GUI client for SoulFire, which is recommended for most users.
            > Instead you should look at the [SoulFireClient releases page](https://github.com/soulfiremc-com/SoulFireClient/releases).
            ---

            ${{ steps.github_release.outputs.changelog }}
          tag_name: ${{ inputs.version }}
          generate_release_notes: false
          draft: false
          prerelease: false
          target_commitish: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: true
          name: SoulFire ${{ inputs.version }}
          preserve_order: true
          files: |
            dedicated-launcher/build/libs/SoulFireDedicated-${{ inputs.version }}.jar
            client-launcher/build/libs/SoulFireCLI-${{ inputs.version }}.jar
      - name: Announce new SoulFire release
        uses: tsickert/discord-webhook@b217a69502f52803de774ded2b1ab7c282e99645 # 7.0.0
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
          content: <@&850705047938793503> New SoulFire version released!
          embed-title: SoulFire ${{ inputs.version }}
          embed-description: SoulFire ${{ inputs.version }} has been released! Changelog and download can be found at https://github.com/soulfiremc-com/SoulFire/releases/tag/${{ inputs.version }}
          embed-color: 3312063
          embed-thumbnail-url: https://soulfiremc.com/logo.png

  deploy-javadoc:
    needs: build
    uses: soulfiremc-com/SoulFire/.github/workflows/deploy-javadoc.yml@main
    permissions:
      contents: write
    secrets: inherit

  deploy-docker:
    needs: build
    uses: soulfiremc-com/SoulFire/.github/workflows/docker-deploy.yml@main
    secrets: inherit

  publish-sdk:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: write
      checks: read
      contents: read
    steps:
      # Trusted publishers must see publish-sdk.yml as the top-level workflow.
      # Calling it as a reusable workflow changes the publishing identity.
      - name: Dispatch SDK publishing
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          publish_run_id="$(gh api --method POST \
            "repos/${GH_REPO}/actions/workflows/publish-sdk.yml/dispatches" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            -f "ref=${GITHUB_REF_NAME}" \
            -f "inputs[version]=${RELEASE_VERSION}" \
            -F 'inputs[publish_npm]=true' \
            -F 'inputs[publish_pypi]=true' \
            -F 'inputs[publish_jsr]=false' \
            --jq '.workflow_run_id')"
          echo "run_id=${publish_run_id}" >> "$GITHUB_OUTPUT"
          echo "SDK publishing: https://github.com/${GH_REPO}/actions/runs/${publish_run_id}" >> "$GITHUB_STEP_SUMMARY"
      - name: Wait for SDK publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PUBLISH_RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: gh run watch "$PUBLISH_RUN_ID" --exit-status --interval 30

  publish-jsr:
    needs: build
    # Preserve the release actor for JSR's scope membership check. npm and PyPI
    # use a separate dispatch to retain their trusted publishing identity.
    uses: soulfiremc-com/SoulFire/.github/workflows/publish-sdk.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      version: ${{ inputs.version }}
      publish_npm: false
      publish_pypi: false
      publish_jsr: true

  set-after-version:
    needs: [ deploy-javadoc, deploy-docker, publish-sdk, publish-jsr ]
    uses: soulfiremc-com/SoulFire/.github/workflows/set-version.yml@main
    permissions:
      contents: write
    with:
      version: ${{ inputs.after-version }}
    secrets: inherit
