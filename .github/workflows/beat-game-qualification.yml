name: Beat-game qualification

on:
  workflow_call:
    inputs:
      runs:
        description: Required consecutive completions
        required: false
        type: number
        default: 1
      controlled:
        description: Use the staged real-Minecraft fixture
        required: false
        type: boolean
        default: false
      seed:
        description: Fixed Minecraft world seed
        required: false
        type: string
        default: SoulFire beat-game qualification v1
  workflow_dispatch:
    inputs:
      runs:
        description: Required consecutive completions
        required: true
        type: number
        default: 5
      controlled:
        description: Use the staged real-Minecraft fixture
        required: true
        type: boolean
        default: false
      seed:
        description: Fixed Minecraft world seed
        required: true
        type: string
        default: SoulFire beat-game qualification v1

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "25"
          distribution: temurin
          check-latest: true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run fixed-seed qualification
        working-directory: sdk/beat-game
        env:
          SOULFIRE_E2E_TIMEOUT_MS: "20700000"
          SOULFIRE_QUALIFICATION_CONTROLLED: ${{ inputs.controlled }}
          SOULFIRE_QUALIFICATION_RUNS: ${{ inputs.runs }}
          SOULFIRE_QUALIFICATION_SEED: ${{ inputs.seed }}
        run: bun run smoke:qualify
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beat-game-qualification
          if-no-files-found: error
          retention-days: 30
          path: temp/beat-game-qualification
