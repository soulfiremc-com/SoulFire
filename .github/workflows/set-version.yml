name: Set Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to set'
        required: true
      update_sdk:
        description: 'Update SDK package versions'
        required: true
        default: false
        type: boolean
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      update_sdk:
        required: false
        default: false
        type: boolean

jobs:
  set-version:
    name: Set Version

    permissions:
      contents: write
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: 'Shared: Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: 'Set Version'
        run: |
          sed -i 's/^maven_version=.*/maven_version='"${INPUTS_VERSION}"'/g' gradle.properties
        env:
          INPUTS_VERSION: ${{ inputs.version }}

      - name: 'Set up Bun'
        if: inputs.update_sdk
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: 'Set SDK Version'
        if: inputs.update_sdk
        run: |
          node scripts/set-sdk-version.mjs "${INPUTS_VERSION}"
          bun install --lockfile-only --frozen-lockfile --ignore-scripts
        env:
          INPUTS_VERSION: ${{ inputs.version }}

      - name: 'Commit Version'
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: 'chore(release): bump version to ${{ inputs.version }}'
