name: Native Vulkan runtime

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux-x86_64, os: linux }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64, os: linux }
          - { runner: windows-2025, platform: windows-x86_64, os: windows, msystem: CLANG64, prefix: clang-x86_64 }
          - { runner: windows-11-arm, platform: windows-arm64, os: windows, msystem: CLANGARM64, prefix: clang-aarch64, jdk_distribution: zulu }
          - { runner: macos-15-intel, platform: macos-x86_64, os: macos }
          - { runner: macos-15, platform: macos-arm64, os: macos }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: ${{ matrix.jdk_distribution || 'temurin' }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: cache
        with:
          path: vulkan-runtime/build/runtime
          key: vulkan-${{ matrix.platform }}-${{ hashFiles('vulkan-runtime/Dockerfile', 'vulkan-runtime/.dockerignore', 'vulkan-runtime/build.gradle.kts', 'vulkan-runtime/scripts/**', 'vulkan-runtime/src/**', 'buildSrc/src/main/kotlin/com/soulfiremc/gradle/*Vulkan*.kt', 'buildSrc/src/main/kotlin/sf-vulkan-runtime.gradle.kts') }}
      - name: Build Linux runtime
        if: steps.cache.outputs.cache-hit != 'true' && matrix.os == 'linux'
        run: ./gradlew :vulkan-runtime:assemble -PvulkanBuildJobs=3
      - name: Set up Windows build tools
        if: steps.cache.outputs.cache-hit != 'true' && matrix.os == 'windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            bison flex
            mingw-w64-${{ matrix.prefix }}-toolchain
            mingw-w64-${{ matrix.prefix }}-cmake
            mingw-w64-${{ matrix.prefix }}-meson
            mingw-w64-${{ matrix.prefix }}-python-mako
            mingw-w64-${{ matrix.prefix }}-python-yaml
            mingw-w64-${{ matrix.prefix }}-python-packaging
            mingw-w64-${{ matrix.prefix }}-llvm
            mingw-w64-${{ matrix.prefix }}-zlib
            mingw-w64-${{ matrix.prefix }}-directx-headers
      - name: Build Windows runtime
        if: steps.cache.outputs.cache-hit != 'true' && matrix.os == 'windows'
        shell: msys2 {0}
        run: ./gradlew :vulkan-runtime:assemble -PvulkanBuildJobs=3
      - name: Build macOS runtime
        if: steps.cache.outputs.cache-hit != 'true' && matrix.os == 'macos'
        run: |
          brew install cmake ninja llvm bison flex meson
          python3 -m venv build/native-tools
          build/native-tools/bin/pip install mako==1.3.10 packaging==25.0 pyyaml==6.0.3 meson==1.9.2
          export PATH="$PWD/build/native-tools/bin:$(brew --prefix llvm)/bin:$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$PATH"
          ./gradlew :vulkan-runtime:assemble -PvulkanBuildJobs=3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vulkan-${{ matrix.platform }}
          path: vulkan-runtime/build/runtime/*.jar
          if-no-files-found: error
      - name: Preserve failed native runtime diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-debug-${{ matrix.platform }}
          retention-days: 3
          path: |
            vulkan-runtime/build/work/*/runtime
            vulkan-runtime/build/work/*/smoke-build/vulkan-smoke*
            vulkan-runtime/build/work/*/mesa-build/meson-logs
