syntax = "proto3";
package soulfire.v1;
option java_package = "com.soulfiremc.grpc.generated";
option java_multiple_files = true;

// An exclusive, authenticated interactive view. Input heartbeats are required
// every second; a stalled client loses control after five seconds.
service PovService {
  rpc Watch (PovWatchRequest) returns (stream PovFrame);
  rpc Input (PovInputRequest) returns (PovInputResponse);
}
message PovWatchRequest {
  string instance_id = 1;
  string bot_id = 2;
  string session_id = 3;
  int32 width = 4;
  int32 height = 5;
}
message PovFrame {
  reserved 1, 2;
  reserved "image", "mime_type";
  uint64 sequence = 3;
  int32 width = 4;
  int32 height = 5;
  bool screen_open = 6;
  // One complete Annex B H.264 access unit. Keyframes include SPS and PPS.
  bytes data = 7;
  uint64 timestamp_us = 8;
  bool key_frame = 9;
  // RFC 6381 codec string derived from the stream's SPS.
  string codec = 10;
  enum CursorShape {
    ARROW = 0;
    TEXT = 1;
    CROSSHAIR = 2;
    POINTER = 3;
    RESIZE_NS = 4;
    RESIZE_EW = 5;
    RESIZE_ALL = 6;
    NOT_ALLOWED = 7;
  }
  // Minecraft's cursor for the GUI in this frame; hidden when screen_open is false.
  CursorShape cursor_shape = 11;
  uint32 target_bitrate = 12;
}
message PovInputRequest {
  string session_id = 1;
  uint64 sequence = 2;
  bool captured = 3;
  int32 width = 4;
  int32 height = 5;
  repeated PovInputEvent events = 6;
  // Forward Escape before releasing local capture, including opening the pause menu.
  bool escape = 7;
  // Recover after dropping dependent frames or resetting the decoder.
  bool request_key_frame = 8;
  PovStreamFeedback feedback = 9;
}
// Client-relative delivery delay avoids requiring synchronized clocks.
message PovStreamFeedback {
  uint64 received_sequence = 1;
  double delivery_delay_ms = 2;
  uint32 decoder_queue_size = 3;
  uint32 decoder_recoveries = 4;
}
message PovInputResponse {}
message PovInputEvent {
  enum Kind {
    KEY = 0;
    CHARACTER = 1;
    BUTTON = 2;
    MOVE = 3;
    SCROLL = 4;
  }
  Kind kind = 1;
  // GLFW key/button number, or Unicode code point for CHARACTER.
  int32 code = 2;
  // GLFW release (0), press (1), or repeat (2).
  int32 action = 3;
  int32 modifiers = 4;
  // Normalized cursor position for screens; relative pixels for mouse look.
  double x = 5;
  double y = 6;
  bool relative = 7;
}
